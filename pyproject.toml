[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-software-factory"
version = "0.1.0"
description = "A durable, budget-aware control plane for an AI software creation engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
software-factory = "software_factory.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
